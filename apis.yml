aid: swiftconnect
name: SwiftConnect
description: >-
  SwiftConnect operates a "connected access network" that unifies digital identity, physical access
  credentials and building infrastructure into one platform, so an employee badge can live in Apple,
  Google or Samsung Wallet and open the doors an employer has authorized. Founded in 2020 and
  headquartered in Stamford, Connecticut, the company sits between access-control systems
  (LenelS2, Software House C-CURE 9000, Genetec), credential providers (HID, LEGIC, Wavelynx),
  identity providers and workplace platforms, and automates credential issuance, permission changes
  and revocation across all of them. It exposes that capability programmatically through the
  SwiftConnect Developer API at https://api.swiftconnect.io — a JSON REST API using bearer JWT
  authentication and a versioned `application/vnd.swiftconnect.v2+json` media type — plus a mobile
  "universal provisioning SDK" for adding credentials to a device wallet. The API reference is
  published on a password-protected ReadMe hub, so no machine-readable contract is public.
