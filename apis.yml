apis:
- aid: swiftconnect:swiftconnect-api
  name: SwiftConnect Developer API
  description: >-
    The SwiftConnect Developer API provides programmatic access to access credentials, permissions,
    people, buildings, readers and devices across the connected access network, so provisioning
    workflows can be automated from a directory, HR system or workplace app instead of being
    administered by hand. It is a JSON REST API served from https://api.swiftconnect.io, authenticated
    with a bearer JWT and version-negotiated through the Accept header
    (application/vnd.swiftconnect.v2+json). The reference is published on SwiftConnect's ReadMe
    developer hub, which is password-protected, so operation-level documentation and any
    machine-readable description are not publicly reachable.
  humanURL: https://swiftconnect.readme.io/
