note: >-
  Assessed without a machine-readable contract — SwiftConnect publishes no OpenAPI and its reference
  is password-protected. Only standards that could be established from the provider's own published
  examples or from live response behaviour are marked true. Everything unestablished is recorded as
  such rather than guessed, and the domain-standard slot is left empty because no physical-access
  standard (OSDP, PSIA, ONVIF, SIA, BACnet, Apple/Google wallet credential profiles) is declared in
  any surface we can read.
