reversibility:
  state: undocumented
  grade: null
  write_surface: true
  note: >-
    The API has a real write surface — SwiftConnect's own published example POSTs a credential to
    /credentials for a person and a room over a date range — and credential revocation is the
    company's core marketing claim ("issue and revoke access"). But no public page names the
    reversal operation, and no window is stated anywhere we can read. Per the pipeline rule, no
    reversal path and no window are asserted here: an invented window on a physical-access API
    could leave a door open. This is `undocumented`, not `na`, and it is undocumented because the
    reference is password-protected — not because the capability is absent.
