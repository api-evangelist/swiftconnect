docs: https://swiftconnect.readme.io/
note: >-
  Cross-cutting runtime semantics for the SwiftConnect Developer API. SwiftConnect publishes no
  public OpenAPI and its reference hub is password-protected, so everything here is either printed
  verbatim on the provider's own public Developer API page or observed on a live unauthenticated
  request. Fields the provider does not publish are recorded as unknown rather than guessed.
authentication:
  style: bearer-jwt
  header: Authorization
  detail: see authentication/swiftconnect-authentication.yml
versioning:
  scheme: media-type
  header: Accept
  current: application/vnd.swiftconnect.v2+json
  note: >-
    Version is negotiated through a vendor media type rather than a URI path prefix. The provider's
    published examples use v2; /v2/... and /api/v2/... path prefixes return 404, confirming the
    version does not live in the path.
  source: https://swiftconnect.io/developer-api/
error_envelope:
  format: custom-json
  rfc9457: false
  content_type: application/json
  fields:
  - name: code
    description: Numeric status code, mirroring the HTTP status.
  - name: message
    description: Human-readable message (e.g. "Invalid JWT").
  - name: client_error_code
    description: Machine-readable client error code; empty string when not set.
  example: '{"code":401,"message":"Invalid JWT","client_error_code":""}'
  detail: see errors/swiftconnect-problem-types.yml
pagination:
  style: unknown
  response_headers:
  - X-Total-Count
  note: >-
    The API advertises `access-control-expose-headers: x-total-count,retry-after`, so a total-count
    header is part of the browser-visible response contract. The page/limit request parameters that
    drive it are documented only inside the gated hub, so the style is recorded as unknown rather
    than assumed.
  evidence: probe:https://api.swiftconnect.io/credentials
rate_limit_signaling:
  response_headers:
  - Retry-After
  note: >-
    Retry-After is explicitly exposed to cross-origin callers. No X-RateLimit-* / RateLimit-*
    headers were observed on the unauthenticated 401 response; whether they appear on authenticated
    responses cannot be established without credentials.
  detail: see rate-limits/swiftconnect-rate-limits.yml
